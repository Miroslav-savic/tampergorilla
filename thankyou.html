<title>TamperGorilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap">

<style>
/* ── Tokens ── */
:root {
  --bg:        #f3f8f5;
  --surface:   #e8f2ec;
  --text:      #152b1e;
  --muted:     #6a9478;
  --border:    #c8ddd0;
  --accent:    #1a7a4a;
  --accent-lo: rgba(26,122,74,.12);
  --error:     #cc4545;
  --error-lo:  rgba(204,69,69,.1);
  --success:   #1a7a4a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0d1a11;
    --surface:   #121f16;
    --text:      #d4ecda;
    --muted:     #4e7a5e;
    --border:    #1e3326;
    --accent:    #2ab568;
    --accent-lo: rgba(42,181,104,.1);
    --error:     #e06060;
    --error-lo:  rgba(224,96,96,.1);
    --success:   #2ab568;
  }
}
:root[data-theme="dark"] {
  --bg:        #0d1a11;
  --surface:   #121f16;
  --text:      #d4ecda;
  --muted:     #4e7a5e;
  --border:    #1e3326;
  --accent:    #2ab568;
  --accent-lo: rgba(42,181,104,.1);
  --error:     #e06060;
  --error-lo:  rgba(224,96,96,.1);
  --success:   #2ab568;
}

/* ── Reset ── */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-inline: 24px;
  padding-block: 48px;
  gap: 0;
}

/* ── Brand bar ── */
.brand {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.01em;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  user-select: none;
}
.brand-gorilla { font-size: 32px; letter-spacing: 0; }

.brand-sub {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: .01em;
  margin-bottom: 48px;
  text-align: center;
}

/* ── Status ring ── */
.ring-wrap {
  position: relative;
  width: 148px;
  height: 148px;
  margin-bottom: 36px;
  flex-shrink: 0;
}

/* Track circle */
.ring-track {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2px solid var(--border);
  transition: border-color .4s;
}

/* Spinning arc — SVG gives cleaner cap control */
.ring-svg {
  position: absolute; inset: 0;
  width: 148px; height: 148px;
  transform: rotate(-90deg);
  opacity: 0;
  transition: opacity .3s;
}
.ring-arc {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-dasharray: 340;
  stroke-dashoffset: 85; /* ~75% filled */
  transform-origin: center;
  animation: spin-arc 1.1s linear infinite;
}
@keyframes spin-arc { to { transform: rotate(360deg); } }

/* Center icon */
.ring-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 54px;
  line-height: 1;
  transition: opacity .35s, transform .35s;
  pointer-events: none;
}
.ring-check {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(.7);
  opacity: 0;
  transition: opacity .35s, transform .35s;
  pointer-events: none;
}
.ring-check svg { display: block; }

/* ── State classes on body ── */

/* detecting: track normal, arc hidden, gorilla faded */
body.s-detecting .ring-icon  { opacity: .45; }
body.s-detecting .ring-svg   { opacity: 0; }

/* installing: arc spins, gorilla more faded */
body.s-installing .ring-icon { opacity: .2; }
body.s-installing .ring-svg  { opacity: 1; }

/* success: track accent, arc gone, check appears */
body.s-success .ring-track   { border-color: var(--success); }
body.s-success .ring-icon    { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
body.s-success .ring-check   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
body.s-success .ring-svg     { opacity: 0; }

/* error: track red, arc gone, gorilla back */
body.s-error .ring-track     { border-color: var(--error); }
body.s-error .ring-icon      { opacity: 1; }
body.s-error .ring-svg       { opacity: 0; }

/* no-extension: track muted, gorilla normal */
body.s-no-ext .ring-icon     { opacity: .7; }
body.s-no-ext .ring-svg      { opacity: 0; }

/* ── Status text ── */
.status-block {
  text-align: center;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.status-headline {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 800;
  line-height: 1.2;
  text-wrap: balance;
  transition: color .3s;
}
body.s-success .status-headline { color: var(--success); }
body.s-error   .status-headline { color: var(--error); }

.status-body {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.65;
  text-wrap: balance;
}

/* Script name pill */
.script-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .02em;
  margin-top: 4px;
}

/* Action button — only in error / no-ext states */
.action-btn {
  display: none;
  margin-top: 8px;
  padding: 9px 22px;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  border: 1.5px solid transparent;
  transition: opacity .2s;
}
.action-btn:hover { opacity: .8; }
.action-btn.variant-accent {
  background: var(--accent);
  color: #fff;
}
.action-btn.variant-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
}
body.s-error   .btn-retry    { display: inline-flex; align-items: center; gap: 6px; }
body.s-no-ext  .btn-get-ext  { display: inline-flex; align-items: center; gap: 6px; }

/* ── Footer ── */
.page-footer {
  margin-top: 72px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .04em;
}
.page-footer a { color: inherit; text-underline-offset: 3px; }

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .ring-arc { animation: none; }
  .ring-icon, .ring-check, .status-headline { transition: none; }
}
</style>

<!-- Hidden container — TamperGorilla finds the .user.js link and injects its
     Install button right after it. display:none hides both from view while
     still allowing programmatic .click() on the injected button. -->
<div id="tg-hook-wrap" aria-hidden="true" style="display:none">
  <a id="tg-link" href="https://raw.githubusercontent.com/Miroslav-savic/tampergorilla/refs/heads/main/nike_discovery.user.js" tabindex="-1"></a>
</div>

<span class="brand"><span class="brand-gorilla">🦍</span> TamperGorilla</span>
<div class="brand-sub">Congratulations, sada možeš koristiti alate!</div>

<div class="ring-wrap" role="status" aria-live="polite" aria-label="Installation status">

  <div class="ring-track"></div>

  <svg class="ring-svg" viewBox="0 0 148 148" aria-hidden="true">
    <circle class="ring-arc" cx="74" cy="74" r="72"/>
  </svg>

  <div class="ring-icon">🦍</div>

  <div class="ring-check" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <polyline points="10,27 21,38 42,16"
        stroke="var(--success)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

</div>

<div class="status-block">
  <div class="status-headline" id="sh">Detecting extension…</div>
  <div class="status-body"    id="sb">Looking for TamperGorilla in your browser</div>

  <div class="script-pill">
    <span>👟</span> Nike Discovery
  </div>

  <a class="action-btn variant-accent btn-retry"
     href="https://raw.githubusercontent.com/Miroslav-savic/tampergorilla/refs/heads/main/nike_discovery.user.js"
     id="retry-btn">Install manually ↗</a>

  <a class="action-btn variant-outline btn-get-ext"
     href="https://github.com/Miroslav-savic/tampergorilla"
     target="_blank" rel="noopener">Get TamperGorilla ↗</a>
</div>

<footer class="page-footer">
  <a href="https://github.com/Miroslav-savic/tampergorilla">github.com/Miroslav-savic/tampergorilla</a>
</footer>

<script>
(function () {
  'use strict';

  var POLL_MS    = 150;  // check every 150ms
  var TIMEOUT_MS = 4000; // give up after 4s

  var body = document.body;
  var sh   = document.getElementById('sh');
  var sb   = document.getElementById('sb');
  var link = document.getElementById('tg-link');

  var detected = false;
  var done     = false;
  var pollTimer, timeoutTimer;

  function setState(state, headline, bodyText) {
    body.className = 's-' + state;
    sh.textContent = headline;
    sb.textContent = bodyText;
  }

  setState('detecting', 'Detecting extension…', 'Looking for TamperGorilla in your browser');

  /* Poll the injected button for install outcome */
  function watchButton(btn) {
    var watcher = setInterval(function () {
      if (done) { clearInterval(watcher); return; }
      var t = btn.textContent || '';
      if (t.indexOf('✅') !== -1 || t.indexOf('Installed') !== -1) {
        done = true;
        clearInterval(watcher);
        setState('success', 'You\'re all set!',
          'Nike Discovery is active. Visit Nike.com and it’ll surface Amazon results automatically.');
      } else if (t.indexOf('❌') !== -1 || t.indexOf('Error') !== -1) {
        done = true;
        clearInterval(watcher);
        setState('error', 'Installation failed',
          'Script could not be fetched from GitHub. Try installing manually.');
      }
    }, POLL_MS);
  }

  /* Find the button TamperGorilla injected next to our link */
  function findTgButton() {
    /* Primary: check direct next sibling inside the display:none wrapper */
    var sibling = link.nextElementSibling;
    if (sibling && sibling.tagName === 'BUTTON') return sibling;

    /* Fallback: search all buttons on the page for TamperGorilla's marker */
    var all = document.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) {
      var t = all[i].textContent || '';
      if (t.indexOf('🦍') !== -1) return all[i];
    }
    return null;
  }

  function attempt() {
    if (done) return true;
    var btn = findTgButton();
    if (!btn) return false;

    detected = true;
    clearInterval(pollTimer);
    clearTimeout(timeoutTimer);
    setState('installing', 'Installing…', 'Nike Discovery is being added to your browser');
    btn.click();
    watchButton(btn);
    return true;
  }

  /* Poll until button appears or timeout */
  pollTimer = setInterval(function () {
    if (attempt()) clearInterval(pollTimer);
  }, POLL_MS);

  /* Try immediately too — in case content script already ran */
  attempt();

  /* Save UTM params from URL into cookies (30-day expiry) */
  (function () {
    var params = new URLSearchParams(window.location.search);
    var utms = ['utmSource', 'utmContent'];
    utms.forEach(function (key) {
      var val = params.get(key);
      if (val) {
        var expires = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = key + '=' + encodeURIComponent(val) + '; expires=' + expires + '; path=/; SameSite=Lax';
      }
    });
  })();

  /* Give up after TIMEOUT_MS if extension never detected */
  timeoutTimer = setTimeout(function () {
    if (!detected) {
      clearInterval(pollTimer);
      setState('no-ext', 'Extension not found',
        'Install TamperGorilla first, then reload this page — the script will install automatically.');
    }
  }, TIMEOUT_MS);
})();
</script>
